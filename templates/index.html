{% for product in products %}
<div class="col-md-4 col-lg-3 mb-4">
    <div class="card h-100 shadow-sm border-0 product-card">
        
        <img src="{{ product.image }}" 
             class="card-img-top p-4 img-product-{{ product.id }}" 
             alt="{{ product.title }}"
             style="height: 250px; object-fit: contain;">
        
        <div class="card-body d-flex flex-column">
            <small class="text-muted mb-1">{{ product.category }}</small>
            
            <h5 class="card-title text-truncate" style="font-size: 1rem;">{{ product.title }}</h5>
            
            <h4 class="text-primary fw-bold mt-auto mb-3">$ {{ product.price }}</h4>
            
            <div class="d-grid gap-2">
                <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-outline-primary">
                    <i class="fas fa-eye"></i> Detail
                </a>
                <button onclick="addToCart('{{ product.id }}')" class="btn btn-success">
                    <i class="fas fa-cart-plus"></i> Beli
                </button>
            </div>
        </div>
    </div>
</div>
{% endfor %}
